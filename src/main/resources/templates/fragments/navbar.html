<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<nav class="navbar navbar-expand-lg"
     style="background-color: #FBF8EF;"
     th:fragment="navbar">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold"
           th:href="@{/}"
           style="color:#24303D;">

            Shelfwise

        </a>


        <!-- Mobile button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar content -->
        <div class="collapse navbar-collapse"
             id="mainNavbar">

            <!-- Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/}">
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/shelves}">
                        Shelves
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/discuss}">
                        Discuss
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/discover}">
                        Discover
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/trends}">
                        Trends
                    </a>

                </li>

            </ul>


            <!-- Search -->
            <form class="d-flex me-3">

                <input class="form-control me-2"
                       type="search"
                       placeholder="Search books...">

                <button class="btn btn-outline-dark"
                        type="submit">
                    Search
                </button>

            </form>


            <!-- Login -->
            <a class="btn btn-outline-dark"
               th:href="@{/login}">
                Sign In
            </a>

        </div>

    </div>

</nav>

</body>
</html>
