<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Discuss - Shelfwise</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.css}">
</head>

<body>

<div th:replace="~{fragments/navbar_loged_in :: navbar}"></div>

<main>

    <section class="py-5"
             style="background-color:#F1ECDD;">

        <div class="container">

            <h1 class="display-5 fw-bold">
                Discuss
            </h1>

            <p class="lead text-muted">
                Talk about books with other readers.
            </p>

            <div class="card mt-4">

                <div class="card-body text-center py-5">

                    <div class="fs-1 mb-3">
                        💬
                    </div>

                    <h4>
                        Discussions coming soon
                    </h4>

                    <p class="text-muted">
                        Book discussions and reader posts
                        will appear here.
                    </p>

                </div>

            </div>

        </div>

    </section>

</main>

</body>
</html>
